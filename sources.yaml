# Daily News Briefing Configuration
briefing:
  top_stories: 8
  hours_window: 24
  language_code: "en-IN"
  tts_speaker: "shreya"          # Options: shreya, aditya, ritu, priya, rohan, etc.
  tts_model: "bulbul:v3"
  llm_model: "sarvam-105b-conversations"

# News Sources
sources:
  rss:
    enabled: true
    feeds:
      - name: "The Hindu - National"
        url: "https://www.thehindu.com/news/national/feeder/default.rss"
      - name: "NDTV Top Stories"
        url: "https://feeds.feedburner.com/ndtvnews-top-stories"
      - name: "Times of India - India"
        url: "https://timesofindia.indiatimes.com/rssfeeds/-2128936835.cms"
      - name: "BBC News - World"
        url: "http://feeds.bbci.co.uk/news/world/rss.xml"

  bluesky:
    enabled: true
    accounts:
      - name: "BBC News (Bluesky)"
        handle: "bbcnews.bsky.social"
      - name: "Reuters (Bluesky)"
        handle: "reuters.bsky.social"

  telegram:
    enabled: true
    channels:
      - name: "Telegram News"
        channel: "telegram"

  twitter:
    enabled: false  # Official API requires paid developer credentials
    accounts:
      - name: "Reuters Tech"
        handle: "ReutersTech"
